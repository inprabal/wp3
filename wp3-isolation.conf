# ============================================================
# WiFi-Pumpkin3 Isolation Toolkit
# Central Configuration
# Kali Linux / Raspberry Pi
# ============================================================

# ---------- Network Interfaces ----------

WP3_INTERFACE="wlan2"
UPLINK_INTERFACE="eth0"

# Interfaces that must remain untouched
PROTECTED_INTERFACES=("eth0" "wlan0")

# ---------- Network Namespace ----------

WP3_NETNS="wp3-ns"

# Host-side and WP3-side virtual Ethernet interfaces
VETH_HOST="veth-wp3-host"
VETH_NS="veth-wp3-ns"

# ---------- WP3 Access Point ----------

WP3_SSID="WP3-Authorized-Lab"
WP3_CHANNEL="11"

WP3_SUBNET="172.16.0.0/24"
WP3_GATEWAY="172.16.0.1"
WP3_NETMASK="255.255.255.0"
WP3_BROADCAST="172.16.0.255"

WP3_DHCP_START="172.16.0.100"
WP3_DHCP_END="172.16.0.150"

# ---------- Namespace Transit Network ----------
# Dedicated point-to-point link between host and namespace

TRANSIT_SUBNET="169.254.250.0/30"
TRANSIT_HOST_IP="169.254.250.1"
TRANSIT_NS_IP="169.254.250.2"

# ---------- Docker Networks ----------
# Must remain inaccessible from WP3 test clients

DOCKER_SUBNETS=(
    "172.17.0.0/16"
    "172.18.0.0/16"
    "172.19.0.0/16"
)

# ---------- Existing LAN ----------
# Must remain inaccessible from WP3 test clients

PRIVATE_LAN_SUBNETS=(
    "192.168.0.0/24"
)

# ---------- Security Policy ----------

ALLOW_INTERNET_AFTER_AUTH="true"
ALLOW_INTERNET_BEFORE_AUTH="false"

BLOCK_PRIVATE_LAN="true"
BLOCK_DOCKER_NETWORKS="true"
BLOCK_HOST_SERVICES="true"

ENABLE_IPV6_ISOLATION="true"

# ---------- Captive Portal ----------

ENABLE_CAPTIVE_PORTAL="true"

# Initial connectivity test must not enable proxy interception
ENABLE_PROXY_INITIAL_TEST="false"
ENABLE_MITM_INITIAL_TEST="false"
ENABLE_BEEF_INITIAL_TEST="false"

# These capabilities remain available for later authorised testing
SUPPORT_PUMPKIN_PROXY="true"
SUPPORT_MITM="true"
SUPPORT_BEEF="true"

# ---------- BeEF ----------
# Existing host BeEF service currently listens on port 3000.
# Do not assume namespace reachability until explicitly configured.

BEEF_HOST_PORT="3000"
BEEF_MANAGEMENT_RESTRICTED="true"

# ---------- Safety Controls ----------

REQUIRE_SETUP_CONFIRMATION="true"
REQUIRE_ROLLBACK_CONFIRMATION="true"

PRESERVE_DOCKER="true"
PRESERVE_HOST_FIREWALL="true"
PRESERVE_PROTECTED_INTERFACES="true"

# ---------- Runtime Paths ----------

WP3_STATE_DIR="/var/lib/wp3-isolation"
WP3_LOG_DIR="/var/log/wp3-isolation"

# ---------- Initial State ----------

WP3_SETUP_COMPLETE="false"
WP3_RUNNING="false"
